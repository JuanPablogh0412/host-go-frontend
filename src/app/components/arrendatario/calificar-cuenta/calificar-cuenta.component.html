<div class="rating-container">
  <div class="rating-card">
    <div class="card-header">
      <h2><i class="fa-regular fa-star"></i> Calificar Cuenta</h2>
      <p>Comparte tu experiencia con este usuario</p>
    </div>

    <form [formGroup]="caliForm" (ngSubmit)="submit()">
      <div class="form-group">
        <label>Tu Calificación</label>
        <div class="star-rating">
          <span *ngFor="let star of [1,2,3,4,5]" 
                (click)="caliForm.get('estrellas')?.setValue(star)"
                [class.active]="star <= caliForm.get('estrellas')?.value">
            <i class="fa-regular fa-star"></i>
          </span>
        </div>
        <small *ngIf="isInvalid('estrellas')" class="error-msg">
          <i class="fa-regular fa-circle-exclamation"></i> Por favor, selecciona una calificación
        </small>
      </div>

      <div class="form-group">
        <label>Tu Comentario</label>
        <textarea 
          formControlName="comentario" 
          placeholder="Describe tu experiencia..."
          rows="4"></textarea>
        <small *ngIf="isInvalid('comentario')" class="error-msg">
          <i class="fa-regular fa-circle-exclamation"></i> Por favor, escribe un comentario
        </small>
      </div>

      <button type="submit" class="submit-btn" [disabled]="caliForm.invalid">
        Enviar Calificación
      </button>
    </form>

    <div class="status-messages">
      <div *ngIf="success" class="success-message">
        <i class="fa-regular fa-circle-check"></i> {{ success }}
      </div>
      <div *ngIf="error" class="error-message">
        <i class="fa-regular fa-circle-xmark"></i> {{ error }}
      </div>
    </div>
  </div>
</div>
